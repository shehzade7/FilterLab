name: FilterLab
options:
  bundleIdPrefix: com.shehzade7
  deploymentTarget:
    iOS: "16.0"
targets:
  FilterLab:
    type: application
    platform: iOS
    sources: [FilterLab]
    info:
      path: FilterLab/Info.plist
      properties:
        CFBundleDisplayName: FilterLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSCameraUsageDescription: FilterLab uses the camera to take photos to edit.
        NSPhotoLibraryAddUsageDescription: FilterLab saves your edited photos to your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shehzade7.filterlab
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
